      return;
    }
    var legacy=JSON.parse(localStorage.getItem(LEGACY_STORE));
    if(!legacy || !legacy.ans) return;
    var mappings={c0:[0,1,1,2,3,4,5],a3:[3,2,0,1,4],c1:[0,0,1,3,4]};
    Object.keys(legacy.ans).forEach(function(id){
      if(!QI[id]) return;
      var old=[].concat(legacy.ans[id]);
      state.ans[id]=old.map(function(i){return mappings[id]?mappings[id][i]:i;})
        .filter(function(i,index,values){ return Boolean(QI[id].opts[i]) && values.indexOf(i)===index; });
    });
    cleanup();
    if(legacy.screen!=="intro"){
      state.screen="q";
      state.idx=Math.max(0,seq().findIndex(function(q){ return !selected(q.id).length; }));

    localStorage.setItem(STORE,JSON.stringify(state));

}

}

function compute(){
  var questions=seq().filter(function(q){return q.scored!==false;});
  var byStep={}, points=[];
  var scale={Z:100,3:50,4:25,5:0};
  questions.forEach(function(q){
    var score=stateOf(q), level=lvlOf(score);
    if(level) byStep[q.step]=level;
    if(Object.hasOwn(scale,score)) points.push(scale[score]);
  });
  function impact(step){
    return (RELATED[step]||[]).filter(function(other){return byStep[other]>=4;}).length;
  }
  var plan=Object.keys(byStep).sort(function(a,b){
    return byStep[b]-byStep[a] || impact(b)-impact(a) || PRIORITY[a]-PRIORITY[b];
  });
  var scenarios=plan.map(function(step){
    var level=byStep[step], question=QI[STEPS[step].q];
    return RULES.find(function(rule){return rule.step===step && rule.lvl===level && rule.when();}) ||
      {step:step,lvl:level,title:question.why,chain:[],first:instrList(step).slice(0,2)};
  });
  var unknown=questions.filter(function(q){
    return selected(q.id).some(function(i){return q.opts[i].s==="N";});
  });
  var max=plan.length ? byStep[plan[0]] : 0;
  var verdict;
  if(max>=5) verdict={cls:"crit",lbl:"Есть критический риск",txt:"Начните с первого шага плана."};
  else if(max===4) verdict={cls:"warn",lbl:"Есть риски, которые стоит снизить",txt:"Начните с рекомендации с наибольшим приоритетом."};
  else if(max===3) verdict={cls:"warn",lbl:"Есть настройки, которые можно улучшить",txt:"Посмотрите план и начните с первого шага."};
  else if(unknown.length) verdict={cls:"warn",lbl:"Есть настройки, которые стоит проверить",txt:"По ответам пока недостаточно сведений для оценки этих настроек."};
  else verdict={cls:"ok",lbl:"В ответах нет признаков серьёзного риска",txt:"Оценка основана на Ваших ответах."};
  var protection=points.length ? Math.round(points.reduce(function(sum,n){return sum+n;},0)/points.length) : null;
  return {scenarios:scenarios,verdict:verdict,plan:plan,unknown:unknown,protection:protection};
}
function chip(st){
  if(st==="Z") return "<span class='chip cZ'>Низкий риск · 1/5</span>";
  if(st==="X") return "<span class='chip cX'>Не относится</span>";
  if(st==="N") return "<span class='chip cN'>Стоит проверить</span>";
  if(st===5) return "<span class='chip c5'>Критический риск · 5/5</span>";
  if(st===4) return "<span class='chip c4'>Высокий риск · 4/5</span>";
  return "<span class='chip c3'>Средний риск · 3/5</span>";
}
